name: Deploy Bootstrap Rollout

on:
  push:
    branches:
      - master
    paths:
      - rollouts/bootstrap-5.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install locked rollout dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert React Native peer subtree is absent
        run: |
          for pkg in react-native metro metro-config metro-transform-worker image-size; do
            if [ -e "node_modules/$pkg" ]; then
              echo "forbidden package installed: $pkg"
              exit 1
            fi
          done
          node -e 'for (const p of ["react-native", "metro", "metro-config", "metro-transform-worker", "image-size"]) { try { require.resolve(p); console.error("forbidden package resolves: " + p); process.exit(1); } catch {} }'
          node -e 'const l = require("./package-lock.json"); const bad = Object.entries(l.packages).filter(([k, v]) => v.peer || /\/(react-native|metro|metro-config|metro-transform-worker|image-size)$/.test(k)); if (bad.length > 0) { console.error("peer subtree in lockfile: " + bad.map(([k]) => k).join(", ")); process.exit(1); }'

      - name: Validate migration contract
        run: |
          node scripts/rolling-self-update.mjs --validate-config --config-file rollouts/bootstrap-5.json
          npm audit --omit=dev --omit=peer --audit-level=high

      - name: Smoke test rollout runtime imports
        run: |
          node --input-type=module -e '
            const [server, crypto, borsh] = await Promise.all([
              import("@peerbit/server"),
              import("@peerbit/crypto"),
              import("@dao-xyz/borsh"),
            ]);
            const failures = [];
            if (typeof server.createClient !== "function") failures.push("@peerbit/server.createClient");
            if (typeof crypto.Ed25519Keypair !== "function") failures.push("@peerbit/crypto.Ed25519Keypair");
            if (typeof borsh.deserialize !== "function") failures.push("@dao-xyz/borsh.deserialize");
            if (failures.length > 0) {
              console.error("missing runtime surface: " + failures.join(", "));
              process.exit(1);
            }
            console.log("runtime import surface verified");
          '

      - name: Test rollout state machine
        run: npm run test:rollout

  rolling_update:
    needs: validate
    runs-on: ubuntu-22.04
    environment: production
    timeout-minutes: 45
    concurrency:
      group: peerbit-bootstrap-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install locked rollout dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert React Native peer subtree is absent
        run: |
          for pkg in react-native metro metro-config metro-transform-worker image-size; do
            if [ -e "node_modules/$pkg" ]; then
              echo "forbidden package installed: $pkg"
              exit 1
            fi
          done
          node -e 'for (const p of ["react-native", "metro", "metro-config", "metro-transform-worker", "image-size"]) { try { require.resolve(p); console.error("forbidden package resolves: " + p); process.exit(1); } catch {} }'
          node -e 'const l = require("./package-lock.json"); const bad = Object.entries(l.packages).filter(([k, v]) => v.peer || /\/(react-native|metro|metro-config|metro-transform-worker|image-size)$/.test(k)); if (bad.length > 0) { console.error("peer subtree in lockfile: " + bad.map(([k]) => k).join(", ")); process.exit(1); }'

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=peer --audit-level=high

      - name: Smoke test rollout runtime imports
        run: |
          node --input-type=module -e '
            const [server, crypto, borsh] = await Promise.all([
              import("@peerbit/server"),
              import("@peerbit/crypto"),
              import("@dao-xyz/borsh"),
            ]);
            const failures = [];
            if (typeof server.createClient !== "function") failures.push("@peerbit/server.createClient");
            if (typeof crypto.Ed25519Keypair !== "function") failures.push("@peerbit/crypto.Ed25519Keypair");
            if (typeof borsh.deserialize !== "function") failures.push("@dao-xyz/borsh.deserialize");
            if (failures.length > 0) {
              console.error("missing runtime surface: " + failures.join(", "));
              process.exit(1);
            }
            console.log("runtime import surface verified");
          '

      - name: Rolling self-update
        env:
          PEERBIT_ADMIN_KEY_B64: ${{ secrets.PEERBIT_ADMIN_KEY_B64 }}
        run: node scripts/rolling-self-update.mjs --config-file rollouts/bootstrap-5.json

      - name: Verify production DNS, TLS, identity, and WebSocket
        run: node scripts/monitor-relays.mjs
